<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/crew.css" />
    <style>
      @font-face {
        font-family: "CrewSC";
        src: url("assets/fonts/crew-sc.woff") format("woff");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #fbf5e4;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #fbf5e4;
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        opacity: 0.05;
        pointer-events: none;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="76"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground" data-layout-ignore></div>
      <svg id="grain" viewBox="0 0 1920 1080" data-layout-ignore aria-hidden="true">
        <filter id="grain-f">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" />
          <feColorMatrix values="0 0 0 0 0.23  0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 1.4 -0.2" />
        </filter>
        <rect width="1920" height="1080" filter="url(#grain-f)" />
      </svg>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="crew" data-composition-id="crew" data-composition-src="compositions/crew.html"
        data-start="5.5" data-duration="10.5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="flow" data-composition-id="flow" data-composition-src="compositions/flow.html"
        data-start="16" data-duration="16" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="reviewer" data-composition-id="reviewer" data-composition-src="compositions/reviewer.html"
        data-start="31.5" data-duration="21.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html"
        data-start="53" data-duration="14" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="close" data-composition-id="close" data-composition-src="compositions/close.html"
        data-start="66.5" data-duration="9.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
