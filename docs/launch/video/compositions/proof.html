<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/crew.css" />
      <style>
        @font-face {
          font-family: "CrewSC";
          src: url("assets/fonts/crew-sc.woff") format("woff");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
        }
        #pf-head {
          position: absolute;
          left: 192px;
          top: 96px;
          width: 1560px;
        }
        #pf-head .en {
          font-size: 60px;
        }
        #pf-head .zh {
          font-size: 34px;
          margin-top: 10px;
        }
        .w {
          display: inline-block;
          margin-right: 0.24em;
        }
        #pf-grid {
          position: absolute;
          left: 182px;
          top: 240px;
          width: 1556px;
          height: 692px;
          display: grid;
          grid-template-columns: repeat(4, 371px);
          grid-template-rows: repeat(2, 334px);
          gap: 24px 24px;
          transform-origin: 50% 0%;
        }
        .paper {
          position: relative;
          padding: 26px 26px;
        }
        .paper .tag {
          display: inline-block;
          padding: 0 14px 3px;
          border-radius: 10px;
          border: 3px solid var(--ink-d);
          font-family: var(--sans);
          font-weight: 900;
          font-size: 28px;
          color: #fffaf0;
        }
        .tag.ml {
          background: var(--teal);
        }
        .tag.ss {
          background: var(--brown);
        }
        .paper .t {
          margin-top: 12px;
          font-family: var(--sans);
          font-weight: 900;
          font-size: 30px;
          color: var(--ink);
          line-height: 1.12;
        }
        .paper .o {
          margin-top: 8px;
          font-family: var(--sans);
          font-weight: 700;
          font-size: 23px;
          line-height: 1.25;
          color: #5a4128;
        }
        .paper .rr {
          position: absolute;
          left: 24px;
          bottom: 24px;
          padding: 0 14px 4px;
          border: 4px solid var(--green);
          border-radius: 10px;
          font-family: var(--sans);
          font-weight: 900;
          font-size: 24px;
          color: #4d7431;
        }
        .tot {
          position: absolute;
          left: 192px;
          width: 1540px;
        }
        #pf-t1 {
          top: 500px;
        }
        #pf-t2 {
          top: 660px;
        }
        #pf-t3 {
          top: 806px;
        }
        #pf-t1 .en {
          font-size: 92px;
        }
        #pf-t2 .en {
          font-size: 58px;
        }
        #pf-t3 .en {
          font-size: 46px;
        }
        .tot .zh {
          font-size: 32px;
          margin-top: 8px;
        }
        .crit {
          color: var(--red);
        }
        .maj {
          color: var(--rust);
        }
        .min {
          color: var(--brown);
        }
      </style>
      <div id="root" data-composition-id="proof" data-width="1920" data-height="1080">
        <div id="pf-head">
          <div class="en"><span class="w">Eight</span><span class="w">papers.</span><span class="w">Four</span><span class="w">gates</span><span class="w">each.</span><span class="w">Clean</span><span class="w">rerun</span><span class="w acc">passed</span></div>
          <div class="zh">八篇论文，每篇都过了四道关卡，干净重跑全部通过。</div>
        </div>
        <div id="pf-grid">
          <div class="paper card" id="pf-p1"><span class="tag ml">ML</span><div class="t">Label noise</div><div class="o">Both hypotheses inconclusive</div><div class="rr">clean rerun 20/20</div></div>
          <div class="paper card" id="pf-p2"><span class="tag ss">Social science</span><div class="t">Null-effect test</div><div class="o">−$9.8 [−358, 338] where the true effect is zero</div><div class="rr">clean rerun 23/23</div></div>
          <div class="paper card" id="pf-p3"><span class="tag ss">Social science</span><div class="t">401(k) DML replication</div><div class="o">All 10 published cells within pre-registered tolerances</div><div class="rr">clean rerun passed</div></div>
          <div class="paper card" id="pf-p4"><span class="tag ss">Social science</span><div class="t">Card–Krueger replication</div><div class="o">Two of three targets reproduced</div><div class="rr">clean rerun 15/15</div></div>
          <div class="paper card" id="pf-p5"><span class="tag ml">ML</span><div class="t">Probability calibration</div><div class="o">H1 contradicted; H2a inconclusive; H2b no difference</div><div class="rr">clean rerun 13/13</div></div>
          <div class="paper card" id="pf-p6"><span class="tag ss">Social science</span><div class="t">LaLonde comparison</div><div class="o">$1,573 [9.6, 3,136]: a contrast, not a program effect</div><div class="rr">clean rerun 19/19</div></div>
          <div class="paper card" id="pf-p7"><span class="tag ss">Social science</span><div class="t">Senate RD replication</div><div class="o">Printed 7.416 reproduced; every role on Claude Haiku</div><div class="rr">clean rerun 15/15</div></div>
          <div class="paper card" id="pf-p8"><span class="tag ss">Social science</span><div class="t">Card college proximity (IV)</div><div class="o">0.132 (0.049) reproduced; robust test: a positive return not established</div><div class="rr">clean rerun 18/18</div></div>
        </div>

        <div class="tot" id="pf-t1">
          <div class="en"><span id="pf-n98">98</span> review rounds</div>
          <div class="zh">98 轮评审。</div>
        </div>
        <div class="tot" id="pf-t2">
          <div class="en"><span class="crit"><span id="pf-n5">5</span> critical</span> · <span class="maj"><span id="pf-n120">120</span> major</span> · <span class="min"><span id="pf-n290">290</span> minor</span> findings</div>
          <div class="zh">找出 5 个致命、120 个重大、290 个次要问题（跨轮重复只算一次）。</div>
        </div>
        <div class="tot" id="pf-t3" data-hold>
          <div class="en">Runs on the <span class="acc">Claude Code or Codex plan</span> you already have</div>
          <div class="zh">用你已有的 Claude Code / Codex 订阅就能跑，不另付 API 费。</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const out = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, t);
        const blurIn = (sel, t) => tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, t);
        const count = (sel, to, t, d) => {
          const el = document.querySelector(sel);
          const o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => { el.textContent = String(Math.round(o.v)); } }, t);
        };

        document.querySelectorAll("#pf-head .w").forEach((w, i) => {
          tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, 0.25 + i * 0.08);
        });
        tl.fromTo("#pf-head .zh", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.8);

        // Papers dealt onto the table, then the rerun stamps.
        for (let i = 1; i <= 8; i++) {
          tl.fromTo("#pf-p" + i, { opacity: 0, y: 60, rotation: i % 2 ? -3 : 3 }, { opacity: 1, y: 0, rotation: 0, duration: 0.55, ease: "expo.out" }, 0.4 + i * 0.16);
          tl.fromTo("#pf-p" + i + " .rr", { opacity: 0, scale: 1.8, rotation: -4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.3, ease: "back.out(1.7)" }, 2.6 + i * 0.2);
        }

        // The grid lifts; the totals land.
        out("#pf-head", 5.4);
        tl.to("#pf-grid", { y: -150, scale: 0.53, duration: 0.7, ease: "power2.inOut" }, 5.5);
        tl.set(["#pf-t1", "#pf-t2", "#pf-t3"], { opacity: 0 }, 0);
        blurIn("#pf-t1", 6.1);
        count("#pf-n98", 98, 6.1, 1.0);
        blurIn("#pf-t2", 7.7);
        count("#pf-n5", 5, 7.7, 0.9);
        count("#pf-n120", 120, 7.7, 0.9);
        count("#pf-n290", 290, 7.7, 0.9);
        blurIn("#pf-t3", 9.5);
        window.__timelines["proof"] = tl;
      </script>
    </template>
  </body>
</html>
