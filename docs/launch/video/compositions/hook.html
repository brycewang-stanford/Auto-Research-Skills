<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="assets/crew.css" />
      <style>
        @font-face {
          font-family: "CrewSC";
          src: url("assets/fonts/crew-sc.woff") format("woff");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
        }
        #hook-text {
          position: absolute;
          left: 192px;
          top: 210px;
          width: 1500px;
        }
        #hook-line {
          font-size: 104px;
        }
        #hook-line .w {
          display: inline-block;
          color: #c9b994;
          margin-right: 0.24em;
        }
        #hook-zh {
          margin-top: 36px;
          margin-left: 4px;
          font-size: 46px;
        }
        #hook-slot {
          position: absolute;
          left: 1280px;
          top: 858px;
          width: 400px;
        }
        #hook-pill {
          font-size: 34px;
          background: var(--rust);
        }
        #hook-duty {
          margin-top: 10px;
          font-family: var(--sans);
          font-weight: 700;
          font-size: 28px;
          color: var(--brown);
        }
      </style>
      <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
        <div id="hook-text">
        <h1 id="hook-line" class="en">
          <span class="w">A</span><span class="w">research</span><span class="w">crew</span><span class="w">whose</span><span class="w">most</span><span class="w">useful</span><span class="w">member</span><span class="w">writes</span><span class="w" id="hook-nothing">nothing.</span>
        </h1>
        <div id="hook-zh" class="zh">一支研究团队，最有用的成员一个字也不写。</div>
        </div>
        <div id="hook-slot">
          <div id="hook-pill" class="pill">Reviewer</div>
          <div id="hook-duty">Never lets up</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const words = document.querySelectorAll("#hook-line .w");
        words.forEach((w, i) => {
          tl.fromTo(w, { color: "#c9b994" }, { color: "#3a2a1a", duration: 0.22, ease: "power2.out" }, 0.15 + i * 0.11);
        });
        tl.fromTo("#hook-nothing", { color: "#3a2a1a" }, { color: "#9c6a1c", duration: 0.3, ease: "power2.inOut", immediateRender: false }, 1.5);
        tl.fromTo("#hook-zh", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, 1.25);
        tl.fromTo("#hook-pill", { opacity: 0, y: -70, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.3);
        tl.fromTo("#hook-duty", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power4.out" }, 2.65);
        tl.to(["#hook-line", "#hook-zh"], { opacity: 0, filter: "blur(10px)", duration: 0.28, ease: "power3.in" }, 5.2);
        window.__timelines["hook"] = tl;
      </script>
    </template>
  </body>
</html>
